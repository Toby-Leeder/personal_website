title: "Toby Leeder"
name: "Toby Leeder"
description: "Personal portfolio — software engineering projects, blog, and résumé."
url: "https://tobyleeder.com"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "default"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jemoji

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      read_time: true
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: "projects"
    values:
      layout: single
      author_profile: false
      toc: true
      toc_sticky: true

author:
  name: "Toby Leeder"
  avatar: "/assets/images/headshot.jpg"
  bio: "CS + Applied Math at UC Berkeley. Full-stack developer."
  location: "Berkeley, CA"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Toby-Leeder"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/toby-leeder/"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:tobyleeder@berkeley.edu"

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
